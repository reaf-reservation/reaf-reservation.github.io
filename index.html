<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Re:af 予約システム</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f7f4ed;
      color: #333;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      color: #5b8f6a;
      margin-bottom: 40px;
    }

    h2 {
      color: #5b8f6a;
      margin-bottom: 30px;
    }

    .menu-button {
      display: block;
      width: 100%;
      padding: 20px;
      margin-bottom: 20px;
      border: none;
      border-radius: 15px;
      background-color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .menu-button:hover {
      background-color: #eef7f0;
    }

    .course-area {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .course-button {
      flex: 1;
      padding: 18px 10px;
      border: 2px solid #9abda2;
      border-radius: 12px;
      background-color: white;
      color: #4f7f5b;
      font-size: 16px;
      cursor: pointer;
    }

    .course-button:hover {
      background-color: #eef7f0;
    }

    .back-button {
      border: none;
      background: none;
      color: #5b8f6a;
      text-decoration: underline;
      cursor: pointer;
      font-size: 15px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 最初の画面 -->
    <div id="homeScreen">

      <h1>🌿 Re:af</h1>

      <button class="menu-button" onclick="showCourseScreen()">
        📅 新しいご予約
      </button>

      <button class="menu-button">
        🔍 ご予約の確認・キャンセル
      </button>

    </div>


    <!-- コース選択画面 -->
    <div id="courseScreen" class="hidden">

      <h2>🌿 Re:af｜空き状況</h2>

      <p>ご希望のコースを選択してください</p>

      <div class="course-area">

        <button class="course-button" onclick="selectCourse(60)">
          60分
        </button>

        <button class="course-button" onclick="selectCourse(90)">
          90分
        </button>

        <button class="course-button" onclick="selectCourse(120)">
          120分
        </button>

      </div>

      <p id="selectedCourse"></p>

      <button class="back-button" onclick="showHomeScreen()">
        ← 最初の画面に戻る
      </button>

    </div>

  </div>


  <script>

    function showCourseScreen() {
      document.getElementById("homeScreen").classList.add("hidden");
      document.getElementById("courseScreen").classList.remove("hidden");
    }

    function showHomeScreen() {
      document.getElementById("courseScreen").classList.add("hidden");
      document.getElementById("homeScreen").classList.remove("hidden");
    }

    function selectCourse(minutes) {
      document.getElementById("selectedCourse").textContent =
        minutes + "分コースが選択されました";
    }

  </script>

</body>
</html>
